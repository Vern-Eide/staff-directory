name: Validate SharePoint web part
on:
  pull_request:
    paths:
      - 'sharepoint/**'
      - 'assets/plugins/ve-staff/public/partials/ve-staff-public-functions.php'
      - 'assets/themes/vern-eide-staff/single-listing.php'
      - 'assets/themes/vern-eide-staff/single-simple-listing.php'
      - 'assets/themes/vern-eide-staff/template-parts/list-html-internal.php'
      - 'assets/themes/vern-eide-staff/inc/assets/js/listing.js'
      - 'assets/themes/vern-eide-staff/inc/assets/css/listing.css'
      - 'assets/themes/vern-eide-staff/functions.php'
      - 'assets/plugins/ve-staff/public/v2/embed-loader.js'
      - 'assets/themes/vern-eide-staff/inc/assets/js/ve-lazy-load.js'
      - 'assets/themes/vern-eide-staff/inc/assets/js/ve-select2.js'
      - '.github/workflows/sharepoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sharepoint/eide-web-staff-integration
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '18.20.8'
          cache: npm
          cache-dependency-path: sharepoint/eide-web-staff-integration/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install app icon resizing dependency
        run: python3 -m pip install Pillow==12.0.0 pypdf==5.9.0
      - run: npm ci
      - run: npm test
      - name: Validate list discovery access and query
        run: |
          php tests/catalog.test.php
          php tests/suggestions.test.php
          php tests/template-context.test.php
      - name: Verify Letter PDF output in Chromium
        run: |
          node tests/print-fixtures.cjs
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=/tmp/ve-print-check/portrait.pdf file:///tmp/ve-print-check/portrait.html
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer --print-to-pdf=/tmp/ve-print-check/landscape.pdf file:///tmp/ve-print-check/landscape.html
          python3 tests/verify-print.py
      - name: Verify compact card spacing in Chromium
        run: |
          node tests/compact-layout.cjs
          google-chrome --headless --no-sandbox --disable-gpu --window-size=1600,900 --dump-dom file:///tmp/ve-layout-check/compact.html > /tmp/ve-layout-check/result.html
          python3 -c 'from pathlib import Path; s=Path("/tmp/ve-layout-check/result.html").read_text(); assert "data-layout-check=\"passed\"" in s, s[-1500:]'
      - run: npm run package
      - name: Verify generated SharePoint package
        id: verify
        run: python3 scripts/verify-package.py
      - uses: actions/upload-artifact@v6
        with:
          name: eide-staff-sharepoint-v${{ steps.verify.outputs.version }}
          path: |
            sharepoint/eide-web-staff-integration/sharepoint/solution/*.sppkg
            sharepoint/eide-web-staff-integration/sharepoint/solution/package-verification.json
          if-no-files-found: error
